name: Mailman

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: mailman
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state database
        uses: actions/cache@v4
        with:
          path: data/
          key: mailman-state-${{ github.run_id }}
          restore-keys: mailman-state-

      - name: Validate required secrets
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          SHEETS_TOKEN_JSON: ${{ secrets.SHEETS_TOKEN_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          missing=()
          [ -z "$GMAIL_CREDENTIALS_JSON" ] && missing+=("GMAIL_CREDENTIALS_JSON")
          [ -z "$GMAIL_TOKEN_JSON" ]        && missing+=("GMAIL_TOKEN_JSON")
          [ -z "$SHEETS_TOKEN_JSON" ]       && missing+=("SHEETS_TOKEN_JSON")
          [ -z "$OPENAI_API_KEY" ]          && missing+=("OPENAI_API_KEY")
          [ -z "$SHEET_ID" ]               && missing+=("SHEET_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required GitHub secrets: ${missing[*]}"
            echo "Run the auth scripts locally, base64-encode each token file, and add them as secrets:"
            echo "  base64 -i credentials/gmail_credentials.json | tr -d '\\n'"
            echo "  base64 -i credentials/gmail_token.json | tr -d '\\n'"
            echo "  base64 -i credentials/sheets_token.json | tr -d '\\n'"
            exit 1
          fi

      - name: Setup credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          SHEETS_TOKEN_JSON: ${{ secrets.SHEETS_TOKEN_JSON }}
          SHEETS_CREDENTIALS_JSON: ${{ secrets.SHEETS_CREDENTIALS_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GMAIL_CREDENTIALS_JSON" | base64 -d > credentials/gmail_credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON"        | base64 -d > credentials/gmail_token.json
          printf '%s' "$SHEETS_TOKEN_JSON"       | base64 -d > credentials/sheets_token.json
          # sheets_credentials.json is needed only if the Sheets token must be re-issued.
          # If you use the same OAuth client for both APIs, SHEETS_CREDENTIALS_JSON can
          # be the same base64 value as GMAIL_CREDENTIALS_JSON.
          if [ -n "$SHEETS_CREDENTIALS_JSON" ]; then
            printf '%s' "$SHEETS_CREDENTIALS_JSON" | base64 -d > credentials/sheets_credentials.json
          else
            cp credentials/gmail_credentials.json credentials/sheets_credentials.json
          fi

      - name: Run mailman
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB_NAME: Applications
          LOOKBACK_HOURS: 4
          GMAIL_MAX_RESULTS: 100
          LOG_LEVEL: INFO
          DRY_RUN: false
        run: python -m src.main
